plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// Optional integration harness, excluded from the distributed mod.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
if (providers.gradleProperty('integrationTests').isPresent()) {
    neoForge.mods.worldchanger.sourceSet sourceSets.test
    neoForge.runs {
        integrationServer {
            server()
            gameDirectory = file('build/integration-server')
            programArgument '--nogui'
            systemProperty 'worldchanger.integrationTests', 'true'
        }
    }
    tasks.named('runIntegrationServer') {
        doLast {
            def failures = fileTree('build/integration-server') { include '**/integration-failed.txt' }
            if (!failures.isEmpty()) throw new GradleException('World Changer integration failed: ' + failures.singleFile.text)
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Permite digitar comandos diretamente no console quando runServer e iniciado pelo Gradle.
tasks.named('runServer') {
    standardInput = System.in
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
